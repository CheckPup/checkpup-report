<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Oscar's Health Report — CheckPup</title>
<style>
/* ================================================================
   CHECKPUP V11 — Premium Health Report (Fully Self-Contained)
   Zero external dependencies. Merged data model with 7-level wellness.
   ================================================================ */
@font-face {
  font-family: 'SF';
  src: local('SF Pro Display'), local('SF Pro Text'), local('.AppleSystemUIFont'),
       local('Segoe UI'), local('Helvetica Neue'), local('Helvetica'), local('Arial');
  font-display: swap;
}
:root{
  --bg:#F7F6F3;--sf:#FFFFFF;
  --bdr:#E5E0D8;--bdr-l:#EFEAE2;
  --t1:#1A1A17;--t2:#5C5C57;--t3:#9C9C96;
  --brand:#C2590A;--brand-h:#A84A08;--brand-l:#FFF5ED;
  --crit:#C62828;--crit-l:#FFEBEE;--crit-bg:#FFF5F5;
  --warn:#D84315;--warn-l:#FFF3E0;
  --caut:#F9A825;--caut-l:#FFFDE7;
  --ok:#2E7D32;--ok-l:#E8F5E9;--ok-bg:#F1F8F2;
  --act:#00695C;--act-d:#004D40;--act-l:#E0F2F1;
  --s1:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --s2:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --s3:0 8px 24px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.06);
  --r:16px;--rm:12px;--rs:8px;
  --fs-xs:10px;--fs-sm:11px;--fs-base:14px;--fs-md:16px;--fs-lg:18px;--fs-xl:20px;--fs-2xl:22px;--fs-3xl:28px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{font-family:'SF',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--t1);line-height:1.6;-webkit-font-smoothing:antialiased;max-width:420px;margin:0 auto}
.hdr{padding:18px 20px 14px;background:#1B4332;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.logo-txt{display:flex;align-items:center}
.logo-img{height:28px;object-fit:contain;filter:brightness(0) invert(1)}
.hdr-btns{display:flex;gap:8px}
.hdr-btn{font-size:13px;font-weight:600;padding:10px 22px;border-radius:100px;border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;transition:all .2s;font-family:inherit;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hdr-btn:active{transform:scale(.95);background:rgba(255,255,255,.15)}
.hero-banner{background:linear-gradient(175deg,#1B4332 0%,#2D6A4F 50%,#40916C 100%);padding:8px 20px 20px;position:relative;overflow:hidden}
.hero-banner::after{content:'';position:absolute;top:-30%;right:-15%;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.06) 0%,transparent 70%)}
.hero-avatar{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hero-avatar svg{width:40px;height:40px}
.hero-id{display:flex;align-items:center;gap:16px;position:relative;z-index:1;margin-bottom:16px}
.hero-info{flex:1;min-width:0}
.hero-name{font-size:var(--fs-3xl);font-weight:800;letter-spacing:-.5px;line-height:1.2;color:#fff}
.hero-meta{font-size:13px;color:rgba(255,255,255,.6);margin-top:4px;font-weight:500}
.hero-vet{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:rgba(255,255,255,.8);background:rgba(255,255,255,.12);padding:7px 16px;border-radius:100px;border:1px solid rgba(255,255,255,.15);position:relative;z-index:1}
.hero-card{background:rgba(255,255,255,.12);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:var(--r);margin:12px 16px 0;padding:22px 24px;position:relative;z-index:2;border:1px solid rgba(255,255,255,.18)}
.hero-card-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
.hero-card-content{flex:1;min-width:0}
.hero-card-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.65);margin-bottom:8px}
.hero-card-title{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.3px;line-height:1.2;color:#fff}
.hero-card-desc{font-size:13.5px;color:rgba(255,255,255,.8);line-height:1.6;margin-top:8px}
.hero-card-desc em{font-style:normal;color:#fff;font-weight:600}
.hero-card-cta{display:inline-block;padding:10px 22px;border-radius:var(--rm);background:rgba(255,255,255,.95);color:var(--brand);font-size:13.5px;font-weight:700;border:none;cursor:pointer;margin-top:14px;font-family:inherit;transition:transform .15s;letter-spacing:-.1px}
.hero-card-cta:active{transform:scale(.96)}
.hero-ring-wrap{position:relative;width:72px;height:72px;flex-shrink:0}
.hero-ring-svg{width:72px;height:72px;transform:rotate(-90deg)}
.hero-ring-bg{fill:none;stroke:var(--bdr-l);stroke-width:5}
.hero-ring-fill{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.hero-ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero-ring-num{font-size:var(--fs-xl);font-weight:800;line-height:1;letter-spacing:-.5px;color:var(--t1)}
.hero-ring-of{font-size:8.5px;color:var(--t3);font-weight:700;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.hero-strip{display:flex;gap:0;margin-top:16px;padding-top:14px;border-top:1px solid var(--bdr-l)}
.hero-stat{flex:1;text-align:center;padding:4px 0}
.hero-stat:not(:last-child){border-right:1px solid var(--bdr-l)}
.hero-stat-num{font-size:var(--fs-2xl);font-weight:800;line-height:1;margin-bottom:3px}
.hero-stat-label{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.3px}
.hero-body{padding:16px 20px 20px}
.hero-priorities{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.hero-pri{display:flex;align-items:center;gap:12px;background:var(--sf);border-radius:var(--rm);padding:14px 14px 14px 0;border:1px solid var(--bdr-l);box-shadow:var(--s1);cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.hero-pri:active{transform:scale(.98);box-shadow:var(--s2)}
.hero-pri-bar{width:4px;align-self:stretch;border-radius:0 0 0 0;flex-shrink:0;margin-left:-1px;border-radius:12px 0 0 12px}
.hero-pri-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hero-pri-body{flex:1;min-width:0}
.hero-pri-label{font-size:14px;font-weight:700;letter-spacing:-.1px}
.hero-pri-sub{font-size:11.5px;color:var(--t2);margin-top:2px;line-height:1.4}
.hero-pri-val{font-size:10px;font-weight:700;padding:3px 9px;border-radius:100px;flex-shrink:0;white-space:nowrap}
.hero-pri-chev{color:var(--t3);font-size:16px;flex-shrink:0;opacity:.3}
.hero-healthy{display:flex;align-items:center;gap:10px;background:var(--ok-bg);border-radius:var(--rm);padding:12px 14px;border:1px solid #C8E6C9;cursor:pointer;transition:transform .15s;margin-bottom:4px}
.hero-healthy:active{transform:scale(.98)}
.hero-healthy-icon{width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.hero-healthy-txt{flex:1;font-size:13px;font-weight:600;color:var(--ok)}
.hero-healthy-chev{color:var(--ok);font-size:16px;opacity:.4}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.hero-grid-box{background:var(--sf);border-radius:var(--rm);padding:16px;border:1px solid var(--bdr-l);cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:var(--s1);display:flex;flex-direction:column;min-height:110px}
.hero-grid-box:active{transform:scale(.98);box-shadow:var(--s2)}
.hero-grid-icon{width:28px;height:28px;margin-bottom:8px;color:var(--t2)}
.hero-grid-label{font-size:13.5px;font-weight:700;letter-spacing:-.1px;color:var(--t1);margin-bottom:4px}
.hero-grid-val{font-size:12px;color:var(--t2);font-weight:500;line-height:1.4}
.hero-grid-bar{height:5px;border-radius:3px;background:var(--bdr-l);margin-top:8px;overflow:hidden}
.hero-grid-bar-fill{height:100%;border-radius:3px}
.hero-grid-link{font-size:11.5px;font-weight:600;color:var(--brand);margin-top:auto;padding-top:8px}
.hero-grid-pill{display:inline-block;font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:100px;margin-top:8px;background:var(--brand-l);color:var(--brand)}
.hero-grid-ring{position:relative;width:44px;height:44px;flex-shrink:0;float:right;margin:-4px -2px 0 6px}
.hero-grid-ring svg{width:44px;height:44px;transform:rotate(-90deg)}
.hero-grid-ring-bg{fill:none;stroke:var(--bdr-l);stroke-width:4}
.hero-grid-ring-fill{fill:none;stroke-width:4;stroke-linecap:round}
.hero-grid-ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:800;line-height:1}
.hero-grid-ring-of{font-size:7px;color:var(--t3);font-weight:600;text-transform:uppercase}
.hero-date{font-size:11px;color:var(--t3);text-align:center;padding:10px 20px 6px}
.sec{padding:8px 20px 24px}
.sec-hdr{display:flex;align-items:center;gap:12px;margin:28px 0 18px}
.sec-hdr::before,.sec-hdr::after{content:'';flex:1;height:1px;background:var(--bdr-l)}
.sec-lbl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--t3);white-space:nowrap}
.fc{background:var(--sf);border-radius:var(--r);margin-bottom:12px;border:1px solid var(--bdr-l);box-shadow:var(--s1);overflow:hidden;cursor:pointer;transition:box-shadow .2s,transform .15s;position:relative}
.fc:active{transform:scale(.985)}
.fc:hover{box-shadow:var(--s2)}
.fc-accent{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px}
.fc-compact{display:flex;align-items:center;gap:14px;padding:16px 16px 16px 20px}
.fc-num{width:28px;height:28px;border-radius:50%;font-size:12px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fc-body{flex:1;min-width:0}
.fc-title{font-size:15.5px;font-weight:700;letter-spacing:-.1px}
.fc-sub{font-size:12.5px;color:var(--t2);margin-top:2px;line-height:1.45}
.fc-chev{width:30px;height:30px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .25s ease,background .2s,color .2s;color:var(--t3)}
.fc.open .fc-chev{transform:rotate(180deg);background:var(--brand-l);color:var(--brand)}
.fc-expand{max-height:0;overflow:hidden;opacity:0;transition:max-height .4s cubic-bezier(.4,0,.2,1),opacity .3s ease}
.fc.open .fc-expand{max-height:1200px;opacity:1}
.fc-inner{padding:4px 20px 20px}
.fc-plain{font-size:13.5px;line-height:1.75;color:var(--t2);margin-bottom:16px}
.fc-reported{background:var(--brand-l);border-radius:var(--rs);padding:12px 14px;font-size:12.5px;line-height:1.55;color:var(--t2);margin-bottom:16px}
.fc-reported strong{color:var(--brand);font-weight:700}
.hs-gradient{height:8px;border-radius:4px;position:relative;margin-bottom:6px;overflow:visible}
.hs-gradient-bar{height:100%;border-radius:4px;background:linear-gradient(to right,var(--ok) 0%,var(--ok) 25%,var(--caut) 45%,var(--warn) 65%,var(--crit) 100%)}
.hs-gradient-dot{position:absolute;top:-4px;width:16px;height:16px;border-radius:50%;background:#1B4332;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transform:translateX(-50%);z-index:1}
.hs-gradient-labels{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--t3);font-weight:600}
.hs-vals{display:flex;justify-content:space-between;font-size:var(--fs-sm);font-weight:600;margin-top:8px}
.hs-val-ideal{color:var(--ok)}
.hs-val-actual{font-weight:700}
.fc-tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.fc-tag{font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:100px}
.fc-wtd{background:var(--bg);border-radius:var(--rs);padding:14px 16px;margin-top:14px}
.fc-wtd-hdr{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--act);margin-bottom:8px}
.fc-wtd li{font-size:12.5px;color:var(--t2);padding:4px 0 4px 20px;position:relative;line-height:1.55;list-style:none}
.fc-wtd li::before{content:'\2713';position:absolute;left:0;color:var(--act);font-weight:700;font-size:11px}
.fc-deep{border-top:1px solid var(--bdr-l);padding-top:14px;margin-top:14px}
.fc-dl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);margin-bottom:6px;margin-top:12px}
.fc-dl:first-child{margin-top:0}
.fc-dlist{list-style:none;padding:0}
.fc-dlist li{font-size:12.5px;color:var(--t2);padding:3px 0 3px 14px;position:relative;line-height:1.5}
.fc-dlist li::before{content:'\2022';position:absolute;left:0;color:var(--t3)}
.gn{background:var(--sf);border-radius:var(--r);margin-bottom:12px;border:1px solid #C8E6C9;overflow:hidden;box-shadow:var(--s1)}
.gn-banner{background:linear-gradient(135deg,#2E7D32 0%,#43A047 100%);padding:16px 18px;color:#fff}
.gn-banner-title{font-size:16px;font-weight:800;letter-spacing:-.2px}
.gn-banner-sub{font-size:12px;opacity:.8;margin-top:2px}
.sys-hdr{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:10px}
.sys-grid{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.sys-tile{background:var(--sf);border-radius:var(--rm);border:1px solid var(--bdr-l);overflow:hidden;transition:box-shadow .2s}
.sys-tile:hover{box-shadow:var(--s2)}
.sys-tile-top{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;transition:background .15s}
.sys-tile-top:active{background:var(--bg)}
.sys-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;color:currentColor}
.sys-name{flex:1;font-size:13px;font-weight:600}
.sys-pill{font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:100px;white-space:nowrap}
.sys-tile-chev{color:var(--t3);font-size:14px;opacity:.3;transition:transform .25s;flex-shrink:0}
.sys-tile.open .sys-tile-chev{transform:rotate(180deg);opacity:.6}
.sys-tile-detail{max-height:0;overflow:hidden;opacity:0;transition:max-height .35s cubic-bezier(.4,0,.2,1),opacity .25s ease}
.sys-tile.open .sys-tile-detail{max-height:800px;opacity:1}
.sys-tile-inner{padding:0 14px 14px;font-size:12.5px;color:var(--t2);line-height:1.6;border-top:1px solid var(--bdr-l);margin-top:0;padding-top:12px}
.sys-tile-ratios{font-size:11px;color:var(--t3);margin-top:6px;font-weight:600}
.sys-more{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--brand);margin-top:10px;cursor:pointer;padding:4px 0;transition:opacity .15s}
.sys-more:active{opacity:.6}
.sys-more-chev{font-size:10px;transition:transform .25s}
.sys-tile.deep .sys-more-chev{transform:rotate(180deg)}
.sys-deep{max-height:0;overflow:hidden;opacity:0;transition:max-height .35s cubic-bezier(.4,0,.2,1),opacity .25s ease}
.sys-tile.deep .sys-deep{max-height:500px;opacity:1}
.sys-deep-inner{padding-top:10px;border-top:1px solid var(--bdr-l);margin-top:8px}
.sys-deep-p{font-size:12px;color:var(--t2);line-height:1.6;margin-bottom:8px}
.sys-deep-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:4px;margin-top:10px}
.sys-deep-list{list-style:none;padding:0}
.sys-deep-list li{font-size:12px;color:var(--t2);padding:2px 0 2px 14px;position:relative;line-height:1.5}
.sys-deep-list li::before{content:'\2022';position:absolute;left:0;color:var(--t3)}
.tox{background:var(--crit-bg);border:1px solid #FFCDD2;border-radius:var(--r);padding:18px;margin-bottom:12px;cursor:pointer;transition:box-shadow .2s,transform .15s;box-shadow:var(--s1)}
.tox:active{transform:scale(.985)}
.tox-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.tox-title{font-size:14.5px;font-weight:700;color:var(--crit)}
.tox-badge{font-size:10px;font-weight:700;background:var(--crit);color:#fff;padding:3px 9px;border-radius:100px}
.tox-sum{font-size:13px;color:var(--t2);line-height:1.6}
.tox-hint{font-size:11px;color:var(--t3);margin-top:6px;font-weight:600;transition:opacity .2s}
.tox-expand{max-height:0;overflow:hidden;opacity:0;transition:max-height .35s cubic-bezier(.4,0,.2,1),opacity .25s ease}
.tox.open .tox-expand{max-height:3000px;opacity:1}
.tox.open .tox-hint{opacity:0;max-height:0;margin:0;overflow:hidden}
.tox-inner{padding-top:14px}
.tox-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.tox-lbl{font-size:12px;font-weight:600;color:var(--t2);width:72px;flex-shrink:0}
.tox-bar{flex:1;height:7px;border-radius:4px;background:#FFCDD2;overflow:hidden}
.tox-fill{height:100%;border-radius:4px;transition:width .5s ease}
.tox-val{font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;text-align:center;flex-shrink:0;white-space:nowrap}
.tox-row-wrap{cursor:pointer;transition:background .15s;border-radius:var(--rs);margin:0 -6px;padding:0 6px}
.tox-row-wrap:active{background:rgba(0,0,0,.03)}
.tox-row-edu{max-height:0;overflow:hidden;opacity:0;transition:max-height .35s cubic-bezier(.4,0,.2,1),opacity .25s ease}
.tox-row-wrap.open .tox-row-edu{max-height:300px;opacity:1}
.tox-edu-inner{padding:8px 0 12px;border-bottom:1px solid var(--bdr-l)}
.tox-edu-what{font-size:12px;color:var(--t2);line-height:1.55;margin-bottom:8px}
.tox-edu-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:4px;margin-top:8px}
.tox-edu-list{list-style:none;padding:0}
.tox-edu-list li{font-size:12px;color:var(--t2);padding:2px 0 2px 14px;position:relative;line-height:1.5}
.tox-edu-list li::before{content:'\2022';position:absolute;left:0;color:var(--t3)}
.tox-row-more{font-size:11px;font-weight:600;color:var(--crit);padding:4px 0;cursor:pointer;display:flex;align-items:center;gap:4px}
.tox-row-wrap.open .tox-row-more .tox-more-chev{transform:rotate(180deg)}
.tox-more-chev{transition:transform .25s;font-size:9px}
.plan{background:var(--sf);border-radius:var(--r);padding:22px 20px;margin-bottom:16px;border:1px solid var(--bdr-l);box-shadow:var(--s1)}
.plan-title{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.plan-desc{font-size:13px;color:var(--t2);margin-bottom:20px;line-height:1.65}
.phase{margin-bottom:24px;position:relative;padding-left:22px}
.phase:last-child{margin-bottom:0}
.phase::before{content:'';position:absolute;left:5px;top:24px;bottom:-24px;width:2px;background:var(--bdr-l);border-radius:1px}
.phase:last-child::before{display:none}
.ph-hdr{display:flex;align-items:center;gap:10px;margin-bottom:8px;position:relative}
.ph-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;position:absolute;left:-22px;top:50%;transform:translateY(-50%);z-index:1;border:2px solid var(--sf)}
.ph-name{font-size:14.5px;font-weight:700}
.ph-when{font-size:11.5px;color:var(--t3)}
.ph-prog{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.ph-prog-bar{flex:1;height:4px;background:var(--bdr-l);border-radius:2px;overflow:hidden}
.ph-prog-fill{height:100%;background:var(--act);border-radius:2px;transition:width .35s ease}
.ph-prog-pct{font-size:10.5px;color:var(--t3);font-weight:600;width:30px;text-align:right}
.ci{display:flex;align-items:flex-start;gap:10px;padding:6px 0;cursor:pointer;-webkit-user-select:none;user-select:none}
.ci:active{opacity:.7}
.ci-box{width:20px;height:20px;border-radius:6px;border:2px solid var(--bdr);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .2s ease;color:transparent;font-size:11px;font-weight:800}

.ci-txt{font-size:13px;color:var(--t2);line-height:1.55;transition:all .2s}
.ci-txt.done{text-decoration:line-through;opacity:.4}
.supp-card{display:flex;align-items:center;gap:12px;background:var(--act-l);border-radius:var(--rs);padding:12px 14px;margin:6px 0 2px}
.supp-card-icon{font-size:20px;flex-shrink:0}
.supp-card-name{font-size:12.5px;font-weight:700;color:var(--act-d)}
.supp-card-why{font-size:11px;color:var(--t2)}
.supp-card-price{font-size:12.5px;font-weight:700;color:var(--act-d);flex-shrink:0}
.diet-card{background:var(--brand-l);border-radius:var(--rs);padding:14px 16px;margin:6px 0 2px}
.diet-card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--brand);margin-bottom:6px}
.diet-card-row{font-size:12px;color:var(--t2);line-height:1.7}
.diet-card-row strong{font-weight:700;color:var(--t1)}
.bundle{background:#004D40;border-radius:var(--r);padding:24px 22px;margin-bottom:16px;color:#fff;text-align:center;box-shadow:0 4px 20px rgba(0,77,64,.15);border:1px solid rgba(255,255,255,.1)}
.bundle h3{font-size:var(--fs-lg);font-weight:800;margin-bottom:6px;letter-spacing:-.2px}
.bundle-sub{font-size:13px;opacity:.85;margin-bottom:16px;line-height:1.55;letter-spacing:-.2px}
.bundle-row{display:flex;justify-content:center;align-items:baseline;gap:10px;margin-bottom:16px}
.bundle-price{font-size:28px;font-weight:800}
.bundle-orig{font-size:15px;text-decoration:line-through;opacity:.5}
.bundle-save{font-size:10.5px;background:rgba(255,255,255,.2);padding:4px 8px;border-radius:100px;font-weight:600}
.bundle-btn{width:100%;padding:14px;border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;font-size:14.5px;font-weight:700;border-radius:var(--rm);cursor:pointer;transition:transform .15s;box-shadow:none;font-family:inherit;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bundle-btn:active{transform:scale(.97)}
.retest{background:#004D40;border-radius:var(--r);padding:24px 20px;margin:0 0 16px;color:#fff;text-align:center;box-shadow:0 4px 20px rgba(0,77,64,.15);border:1px solid rgba(255,255,255,.1)}
.retest h3{font-size:var(--fs-lg);font-weight:700;margin-bottom:6px;letter-spacing:-.2px}
.retest p{font-size:13px;opacity:.8;margin-bottom:18px;line-height:1.55;letter-spacing:-.2px}
.timeline{display:flex;align-items:center;justify-content:center;margin:18px 0}
.tl-step{display:flex;flex-direction:column;align-items:center;gap:4px}
.tl-dot{width:12px;height:12px;border-radius:50%;background:white}
.tl-dot.future{background:transparent;border:2px solid rgba(255,255,255,.4)}
.tl-label{font-size:10px;opacity:.65;white-space:nowrap}
.tl-line{width:48px;height:2px;background:rgba(255,255,255,.2)}
.retest-btn{display:inline-block;background:rgba(255,255,255,.15);color:#fff;border:1.5px solid rgba(255,255,255,.3);padding:14px 28px;border-radius:25px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .15s;box-shadow:none;font-family:inherit;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.retest-btn:active{transform:scale(.95)}
.ns{background:var(--sf);border-radius:var(--r);padding:18px 20px;margin-bottom:10px;border:1px solid var(--bdr-l);display:flex;gap:14px;align-items:center;box-shadow:var(--s1)}
.ns-icon{font-size:28px;flex-shrink:0}
.ns-info{flex:1;min-width:0}
.ns-info h4{font-size:14px;font-weight:700}
.ns-info p{font-size:12px;color:var(--t2);margin-top:2px;line-height:1.45}
.ns-btn{font-size:12px;font-weight:700;padding:8px 16px;border-radius:var(--rs);border:1.5px solid var(--bdr);background:var(--sf);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;font-family:inherit}

.ns-btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.lab-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.lab-modal-overlay.open{display:flex}
.lab-modal{background:var(--bg);width:100%;max-width:420px;max-height:92vh;border-radius:20px 20px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;animation:labSlide .3s ease}

.lab-modal-title{font-size:var(--fs-lg);font-weight:800;letter-spacing:-.3px}
.lab-modal-close{width:32px;height:32px;border-radius:50%;background:var(--bdr-l);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--t2);font-family:inherit;transition:background .15s}

.lab-sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--bdr-l)}
.lab-m-grid{display:flex;gap:6px;padding:8px 2px 4px}

.lab-m-bar-wrap{width:100%;height:140px;background:var(--bg);border-radius:6px;position:relative;display:flex;align-items:flex-end;overflow:visible;border:1px solid var(--bdr-l)}

.lab-m-ideal-zone{position:absolute;left:0;right:0;background:rgba(46,125,50,.08);border-top:1px dashed rgba(46,125,50,.3);border-bottom:1px dashed rgba(46,125,50,.3)}
.lab-m-mark{position:absolute;left:2px;right:2px;height:2.5px;background:#fff;border-radius:2px;z-index:2;box-shadow:0 0 0 1px rgba(0,0,0,.15),0 1px 3px rgba(0,0,0,.15)}
.lab-m-name{font-size:9px;font-weight:800;color:var(--t1);margin-top:8px;text-align:center;letter-spacing:.2px;text-transform:uppercase;line-height:1}

.lab-r-mean{width:50px;text-align:center;font-size:11px;color:var(--t3);font-weight:600}
.lab-r-val{width:50px;text-align:center;font-size:12px;font-weight:700}
.lab-r-badge{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:700}
.lab-tox-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bdr-l)}
.lab-tox-row:last-child{border-bottom:none}

.lab-t-bar-wrap{flex:1;height:6px;background:var(--bdr-l);border-radius:3px;position:relative;overflow:visible}
.lab-t-bar{height:100%;border-radius:3px}

.lab-t-ref{font-size:10px;color:var(--t3);width:40px;text-align:right;flex-shrink:0}

.ftr-links a{color:var(--t3);text-decoration:none}
.ftr-disc{font-size:10.5px;color:var(--t3);margin-top:12px;line-height:1.6;max-width:300px;margin-left:auto;margin-right:auto}

.view-toggle{display:flex;background:rgba(255,255,255,.12);border-radius:100px;padding:3px;max-width:220px;border:1px solid rgba(255,255,255,.15);position:relative;z-index:1;margin-top:12px}

function getSev(k) {
  var r = RATIOS[k];
  var wellCat = null;
  var wKeys = Object.keys(WELLNESS);
  for (var i = 0; i < wKeys.length; i++) {
    if (WELLNESS[wKeys[i]].ratio === k) { wellCat = WELLNESS[wKeys[i]]; break; }
  }
  if (wellCat) {
    var pv = wellCat.progressValue;
    if (pv === "Optimal") return {lv:"grn",c:"var(--ok)",bg:"var(--ok-l)"};
    if (pv === "High" || pv === "Low") return {lv:"ylw",c:"var(--caut)",bg:"var(--caut-l)"};
    if (pv === "ModerateHigh" || pv === "ModerateLow") return {lv:"org",c:"var(--warn)",bg:"var(--warn-l)"};
    return {lv:"red",c:"var(--crit)",bg:"var(--crit-l)"};
  }
  var d = Math.abs(r.val - r.mean) / r.mean;
  if (d < 0.25) return {lv:"grn",c:"var(--ok)",bg:"var(--ok-l)"};
  if (d < 0.5)  return {lv:"ylw",c:"var(--caut)",bg:"var(--caut-l)"};
  if (d < 1.5)  return {lv:"org",c:"var(--warn)",bg:"var(--warn-l)"};
  return {lv:"red",c:"var(--crit)",bg:"var(--crit-l)"};
}

function getSystemSev(sys) {
  var pv = sys.progressValue || sys.sev;
  return SYS_SEV_MAP[pv] || SEV_MAP[pv] || SEV_MAP["unlikely"];
}

function getPos(k) {
  var r = RATIOS[k], ratio = r.val / r.mean;
  if (ratio <= 1) return 5 + ratio * 45;
  return 50 + Math.min((ratio - 1) / 4, 1) * 45;
}

        '<div class="lab-m-bar" style="height:' + barPct.toFixed(1) + '%;background:' + barGrad + '"></div>' +
        '<div class="lab-m-mark" style="bottom:' + idealPct.toFixed(1) + '%"></div>' +
      '</div>' +
      '<div class="lab-m-name">' + m.key + '</div>' +
      '<div class="lab-m-full">' + m.name + '</div>' +
    '</div>';
  }).join('');

  var RATIO_KEYS = ["CaK","CaMg","CaP","NaK","NaMg","ZnCu","FeCu"];
  var ratioRows = RATIO_KEYS.map(function(k) {
    var r = RATIOS[k], s = getSev(k);
    var badgeColor = s.c;
    var badgeBg = s.bg;
    return '<div class="lab-ratio-row">' +
      '<div class="lab-r-name">' + r.ratio + '</div>' +
      '<div class="lab-r-mean">' + r.mean + '</div>' +
      '<div class="lab-r-val"><span class="lab-r-badge" style="background:' + badgeBg + ';color:' + badgeColor + '">' + r.val + '</span></div>' +
    '</div>';
  }).join('');

  var ratioHeader = '<div class="lab-ratio-row" style="padding:6px 0;border-bottom:2px solid var(--bdr)">' +
    '<div class="lab-r-name" style="font-size:10px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.5px">Ratio</div>' +
    '<div class="lab-r-mean" style="font-size:10px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.5px">Ideal</div>' +
    '<div class="lab-r-val" style="font-size:10px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.5px">Oscar</div>' +
  '</div>';

  var toxRows = TOXICS.map(function(t) {
    var pct = Math.min((t.val / (t.max * 3)) * 100, 100);
    var over = t.val > t.max;
    var ratio = t.val / t.max;
    var barColor = over ? 'var(--crit)' : ratio > 0.6 ? 'var(--warn)' : 'var(--caut)';
    var valColor = over ? 'var(--crit)' : 'var(--t1)';
    return '<div class="lab-tox-row">' +
      '<div class="lab-t-name">' + t.key + '</div>' +
      '<div class="lab-t-bar-wrap"><div class="lab-t-bar" style="width:' + pct.toFixed(1) + '%;background:' + barColor + '"></div></div>' +
      '<div class="lab-t-val" style="color:' + valColor + '">' + t.val + '</div>' +
      '<div class="lab-t-ref">' + String.fromCharCode(8804) + t.max + '</div>' +
    '</div>';
  }).join('');

  return '<div class="lab-modal-overlay" id="lab-modal">' +
    '<div class="lab-modal">' +
      '<div class="lab-modal-hdr">' +
        '<div class="lab-modal-title">Lab Values</div>' +
        '<button class="lab-modal-close" data-action="close-lab">' + String.fromCharCode(10005) + '</button>' +
      '</div>' +
      '<div class="lab-modal-body">' +
        petInfo +
        '<div class="lab-sec-title">Nutrient Minerals</div>' +
        '<div style="background:var(--sf);border-radius:var(--rm);border:1px solid var(--bdr-l);padding:12px 10px 8px">' +
          '<div class="lab-m-grid">' + mineralCols + '</div>' +
          '<div style="display:flex;align-items:center;gap:12px;margin-top:10px;padding:8px 8px 4px;font-size:9px;color:var(--t3);font-weight:600;border-top:1px solid var(--bdr-l)">' +
            '<span style="display:flex;align-items:center;gap:4px"><span style="display:inline-block;width:12px;height:2.5px;background:#fff;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.15)"></span> Ideal</span>' +
            '<span style="display:flex;align-items:center;gap:4px"><span style="display:inline-block;width:10px;height:10px;background:rgba(46,125,50,.08);border:1px dashed rgba(46,125,50,.3);border-radius:2px"></span> Ideal zone</span>' +
          '</div>' +
        '</div>' +
        '<div class="lab-sec-title">Mineral Ratios</div>' +
        '<div style="background:var(--sf);border-radius:var(--rm);border:1px solid var(--bdr-l);padding:6px 14px">' + ratioHeader + ratioRows + '</div>' +
        '<div class="lab-sec-title">Toxic Metals</div>' +
        '<div style="background:var(--sf);border-radius:var(--rm);border:1px solid var(--bdr-l);padding:10px 14px">' +
          '<div style="display:flex;justify-content:flex-end;gap:8px;font-size:9px;color:var(--t3);font-weight:600;margin-bottom:6px;padding-right:2px"><span style="width:46px;text-align:right">VALUE</span><span style="width:40px;text-align:right">LIMIT</span></div>' +
          toxRows +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function buildHeader() {
  var logoUrl = 'https://checkpup.com/cdn/shop/files/Asset_1_300x_c1e1b68c-32d8-4691-918c-48b3f7fca461_384x96.png?v=1634664606';
  return '<div class="hdr"><div class="logo-txt"><img class="logo-img" src="' + logoUrl + '" alt="CheckPup"></div><div class="hdr-btns"><button class="hdr-btn" data-action="open-lab">Lab Values</button><button class="hdr-btn" data-action="download-pdf">' + SVG_ICONS.stethoscope + ' Share with Vet</button></div></div>';
}

  var banner = '<div class="hero-banner"><div class="hero-id">' + dogAvatar +
    '<div class="hero-info">' +
      '<div class="hero-name">' + PET.name + '\'s Health Report</div>' +
      '<div class="hero-meta">' + PET.breed + ' ' + String.fromCharCode(183) + ' ' + PET.sex + ' ' + String.fromCharCode(183) + ' ' + PET.age + '</div>' +
    '</div></div>' +
    '<div class="hero-vet">' + String.fromCharCode(8226) + ' Vet-Developed Analysis</div>' +
    '<div class="view-toggle" id="view-toggle">' +
      '<button class="view-toggle-btn active" data-view="summary">Summary</button>' +

    '</svg>' +
    '<div class="hero-ring-center"><div class="hero-ring-num">' + Math.round(pctHealthy * 100) + '</div><div class="hero-ring-of">Score</div></div></div>';

  var oxTagSvg = '<svg style="width:14px;height:14px;display:inline-block;vertical-align:-2px" viewBox="0 0 24 24" fill="currentColor">' +
    '<path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/>' +
    '</svg>';

  var topKey = PRI.length > 0 ? PRI[0] : KEYS[0];
  var topR = RATIOS[topKey];
  var topMult = (topR.val / topR.mean).toFixed(0);
  var topNoun = topR.label.toLowerCase().replace(' function','').replace(' performance','').replace(' level','');
  var card = '<div class="hero-card">' +
    '<div class="hero-card-label">TOP INSIGHT</div>' +
    '<div class="hero-card-title">' + PET.name + ' is in ' + topNoun + ' stress.</div>' +
    '<div class="hero-card-desc">His ' + topR.label.toLowerCase() + ' ratio is ' + topMult + 'x above optimal, affecting energy, weight, and coat. The good news: diet and supplements can help.</div>' +
    '<button class="hero-card-cta" data-scroll="systems-section">View recommendations ' + String.fromCharCode(8594) + '</button>' +
  '</div>';

  var priCards = '';
  if (PRI.length > 0) {
    var priColors = {CaK:'var(--crit)',NaK:'var(--warn)',NaMg:'var(--caut)'};
    var priIcons = {CaK:SVG_ICONS.scale,NaK:SVG_ICONS.zap,NaMg:SVG_ICONS.leaf};
    priCards = '<div class="hero-priorities">' +
      PRI.map(function(k, idx) {
        var r = RATIOS[k];
        var s = getSev(k);
        var icon = priIcons[k] || SVG_ICONS.alertCircle;
        var color = priColors[k] || 'var(--crit)';
        var badgeLabel = s.lv === 'red' ? 'Priority' : 'Moderate';
        return '<div class="hero-pri" data-scroll="finding-' + k + '">' +
          '<div class="hero-pri-bar" style="background:' + color + '"></div>' +
          '<div class="hero-pri-icon" style="background:' + s.bg + '">' + icon + '</div>' +
          '<div class="hero-pri-body">' +
            '<div class="hero-pri-label">' + r.label + '</div>' +
            '<div class="hero-pri-sub">' + r.val + ' vs ' + r.mean + ' optimal</div>' +
          '</div>' +
          '<div class="hero-pri-val" style="background:' + s.bg + ';color:' + color + '">' + badgeLabel + '</div>' +
          '<div class="hero-pri-chev">' + SVG_ICONS.chevronRight + '</div>' +
        '</div>';
      }).join('') +
    '</div>';
  }

  var healthyBar = '';
  if (THR.length > 0) {
    var thrNames = THR.map(function(k) { return RATIOS[k].short; });
    var thrDisplay = thrNames.slice(0, 2).join(', ');
    if (thrNames.length > 2) thrDisplay = thrDisplay + ' +' + (thrNames.length - 2) + ' more';
    healthyBar = '<div class="hero-healthy" data-scroll="good-news">' +
      '<div class="hero-healthy-icon">' + String.fromCharCode(10003) + '</div>' +
      '<div class="hero-healthy-txt">' + THR.length + ' areas thriving ' + String.fromCharCode(8212) + ' ' + thrDisplay + '</div>' +
      '<div class="hero-healthy-chev">' + SVG_ICONS.chevronRight + '</div>' +
    '</div>';
  }

  var healthySystems = SYSTEMS.filter(function(s) { return s.progressValue === 'Unlikely'; }).length;
  var flaggedSystems = SYSTEMS.length - healthySystems;
  var critSystems = SYSTEMS.filter(function(s) { var pv = s.progressValue; return pv === 'ReasonablyCertain' || pv === 'HighlyLikely'; }).length;
  var warnSystems = SYSTEMS.filter(function(s) { var pv = s.progressValue; return pv === 'Likely' || pv === 'Possible'; }).length;
  var cautSystems = SYSTEMS.filter(function(s) { var pv = s.progressValue; return pv === 'ModerateChance' || pv === 'SlightChance'; }).length;
  var moderateToxins = TOXICS.filter(function(t) { return !t.val > t.max && (t.val / t.max) > 0.6; }).length;
  var belowToxins = TOXICS.length - elevatedToxins;
  var ringR = 16;
  var ringC = 2 * Math.PI * ringR;
  var ringPct = healthyCount / total;
  var ringOff = ringC - (ringC * ringPct);

  var gridBoxes = '<div class="hero-grid">' +
    '<div class="hero-grid-box" data-scroll="what-we-found">' +
      '<div class="hero-grid-ring">' +
        '<svg viewBox="0 0 40 40"><circle class="hero-grid-ring-bg" cx="20" cy="20" r="' + ringR + '"/>' +
        '<circle class="hero-grid-ring-fill" cx="20" cy="20" r="' + ringR + '" stroke="var(--ok)" stroke-dasharray="' + ringC.toFixed(1) + '" stroke-dashoffset="' + ringOff.toFixed(1) + '"/></svg>' +
        '<div class="hero-grid-ring-txt">' + healthyCount + '<span class="hero-grid-ring-of">OF ' + total + '</span></div>' +
      '</div>' +
      '<div class="hero-grid-label">Wellness Check</div>' +
      '<div class="hero-grid-val" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">' +
        (PRI.length > 0 ? '<span style="display:inline-flex;align-items:center;gap:3px"><span style="width:7px;height:7px;border-radius:50%;background:var(--crit);display:inline-block"></span>' + PRI.length + ' priority</span>' : '') +
        (WATCH.length > 0 ? '<span style="display:inline-flex;align-items:center;gap:3px"><span style="width:7px;height:7px;border-radius:50%;background:var(--caut);display:inline-block"></span>' + WATCH.length + ' watch</span>' : '') +
        (THR.length > 0 ? '<span style="display:inline-flex;align-items:center;gap:3px"><span style="width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block"></span>' + THR.length + ' good</span>' : '') +
      '</div>' +
      '<div class="hero-grid-bar" style="display:flex;gap:1px;background:none">' +
        (PRI.length > 0 ? '<div style="flex:' + PRI.length + ';height:5px;border-radius:3px;background:var(--crit)"></div>' : '') +
        (WATCH.length > 0 ? '<div style="flex:' + WATCH.length + ';height:5px;border-radius:3px;background:var(--caut)"></div>' : '') +
        (THR.length > 0 ? '<div style="flex:' + THR.length + ';height:5px;border-radius:3px;background:var(--ok)"></div>' : '') +
      '</div>' +
      '<div class="hero-grid-link">View details</div>' +
    '</div>' +
    '<div class="hero-grid-box" data-scroll="systems-section">' +
      '<div class="hero-grid-icon">' + SVG_ICONS.stethoscope + '</div>' +
      '<div class="hero-grid-label">Systems Check</div>' +
      '<div class="hero-grid-val" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">' +
        (critSystems > 0 ? '<span style="display:inline-flex;align-items:center;gap:3px"><span style="width:7px;height:7px;border-radius:50%;background:var(--crit);display:inline-block"></span>' + critSystems + ' flagged</span>' : '') +
        (warnSystems > 0 ? '<span style="display:inline-flex;align-items:center;gap:3px"><span style="width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block"></span>' + warnSystems + ' watch</span>' : '') +
        (cautSystems > 0 ? '<span style="display:inline-flex;align-items:center;gap:3px"><span style="width:7px;height:7px;border-radius:50%;background:var(--caut);display:inline-block"></span>' + cautSystems + ' monitor</span>' : '') +
        (healthySystems > 0 ? '<span style="display:inline-flex;align-items:center;gap:3px"><span style="width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block"></span>' + healthySystems + ' healthy</span>' : '') +
      '</div>' +
      '<div class="hero-grid-bar" style="display:flex;gap:1px;background:none">' +
        (critSystems > 0 ? '<div style="flex:' + critSystems + ';height:5px;border-radius:3px;background:var(--crit)"></div>' : '') +
        (warnSystems > 0 ? '<div style="flex:' + warnSystems + ';height:5px;border-radius:3px;background:var(--warn)"></div>' : '') +
        (cautSystems > 0 ? '<div style="flex:' + cautSystems + ';height:5px;border-radius:3px;background:var(--caut)"></div>' : '') +
        (healthySystems > 0 ? '<div style="flex:' + healthySystems + ';height:5px;border-radius:3px;background:var(--ok)"></div>' : '') +
      '</div>' +
      '<div class="hero-grid-link">View details</div>' +
    '</div>' +
    '<div class="hero-grid-box" data-scroll="plan-section">' +
      '<div class="hero-grid-icon" style="color:var(--brand)">' + SVG_ICONS.zap + '</div>' +
      '<div class="hero-grid-label">Metabolism + Diet</div>' +
      '<div class="hero-grid-val" style="color:var(--brand)">' + PET.oxType + '</div>' +
      '<div class="hero-grid-pill">' + oxTagSvg + ' Tailored diet plan</div>' +
    '</div>' +
    '<div class="hero-grid-box" data-scroll="toxin-section">' +
      '<div class="hero-grid-icon" style="color:var(--warn)">' + SVG_ICONS.warning + '</div>' +
      '<div class="hero-grid-label">Toxic Metals</div>' +
      '<div class="hero-grid-val" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">' +
        '<span style="font-size:11px;color:var(--t3)">' + TOXICS.length + ' tested</span>' +
        (elevatedToxins > 0 ? '<span style="display:inline-flex;align-items:center;gap:3px;color:var(--crit)"><span style="width:7px;height:7px;border-radius:50%;background:var(--crit);display:inline-block"></span>' + elevatedToxins + ' over limit</span>' : '') +
        (belowToxins > 0 ? '<span style="display:inline-flex;align-items:center;gap:3px"><span style="width:7px;height:7px;border-radius:50%;background:var(--caut);display:inline-block"></span>' + belowToxins + ' detected</span>' : '') +
      '</div>' +
      '<div class="hero-grid-bar" style="display:flex;gap:1px;background:none">' +
        (elevatedToxins > 0 ? '<div style="flex:' + elevatedToxins + ';height:5px;border-radius:3px;background:var(--crit)"></div>' : '') +
        (belowToxins > 0 ? '<div style="flex:' + belowToxins + ';height:5px;border-radius:3px;background:var(--caut)"></div>' : '') +
      '</div>' +
      '<div class="hero-grid-link">View details</div>' +
    '</div>' +
  '</div>';

  var body = '<div class="hero-body">' + gridBoxes + priCards + healthyBar + '</div>';
  var heroDate = '<div class="hero-date">Tested ' + PET.testDate + ' ' + String.fromCharCode(183) + ' Kit #' + PET.kitId + '</div>';

  return banner + card + '</div>' + body + heroDate;
}

function buildSecHdr(label) {
  return '<div class="sec-hdr"><span class="sec-lbl">' + label + '</span></div>';
}

function buildFindings() {
  var allFourLowBanner = '';
  if (allFourLow) {
    allFourLowBanner = '<div style="background:var(--crit-bg);border:1.5px solid var(--crit);border-radius:var(--rm);padding:14px 16px;margin:20px 20px 16px">' +
      '<div style="font-size:13px;font-weight:800;color:var(--crit);margin-bottom:4px">' + SVG_ICONS.alertCircle + ' All-Four-Low Pattern Detected</div>' +
      '<div style="font-size:12px;color:var(--t2);line-height:1.5">Oscar\'s thyroid, adrenal, and energy markers are all significantly depleted simultaneously. This is a recognized pattern in HTMA analysis indicating profound metabolic slowdown that requires coordinated support across multiple systems.</div>' +
    '</div>';
  }

  var cards = PRI.map(function(k, idx) {
    var r = RATIOS[k], s = getSev(k), pos = getPos(k);
    var deviation = r.val / r.mean;
    var sevLabel, sevColor;
    if (s.lv === 'org') { sevLabel = 'Concern ' + String.fromCharCode(183) + ' ' + deviation.toFixed(1) + 'x ' + (r.val > r.mean ? 'above' : 'below') + ' optimal'; sevColor = 'var(--warn)'; }
    else { sevLabel = 'Priority ' + String.fromCharCode(183) + ' ' + deviation.toFixed(1) + 'x ' + (r.val > r.mean ? 'above' : 'below') + ' optimal'; sevColor = 'var(--crit)'; }

    var innerHtml = '';
    if (r.plain) {
      innerHtml += '<div class="fc-plain">' + r.plain + '</div>';
    }
    if (r.reported) {
      innerHtml += '<div class="fc-reported"><strong>What you told us: </strong>' + r.reported.join(", ") + '</div>';
    }
    innerHtml += '<div style="margin-bottom:16px">' +
      '<div class="hs-gradient">' +
        '<div class="hs-gradient-bar"></div>' +
        '<div class="hs-gradient-dot" style="left:' + pos + '%"></div>' +
      '</div>' +
      '<div class="hs-gradient-labels"><span>Optimal</span><span>Watch</span><span>Concern</span><span>Priority</span></div>' +
      '<div class="hs-vals"><span class="hs-val-ideal">Ideal: ' + r.mean + '</span><span class="hs-val-actual" style="color:' + s.c + '">Oscar: ' + r.val + '</span></div>' +
    '</div>';
    if (r.systems) {
      innerHtml += '<div class="fc-tags">' + r.systems.map(function(sys) {
        return '<span class="fc-tag" style="background:' + s.bg + ';color:' + s.c + '">' + sys + '</span>';
      }).join('') + '</div>';
    }
    if (r.actions) {
      innerHtml += '<div class="fc-wtd"><div class="fc-wtd-hdr">What to do</div><ul>' +
        r.actions.map(function(a) { return '<li>' + a + '</li>'; }).join('') + '</ul></div>';
    }
    if (r.signs || r.factors) {
      innerHtml += '<div class="fc-deep">';
      if (r.signs) {
        innerHtml += '<div class="fc-dl">Signs to watch</div><ul class="fc-dlist">' +
          r.signs.map(function(si) { return '<li>' + si + '</li>'; }).join('') + '</ul>';
      }
      if (r.factors) {
        innerHtml += '<div class="fc-dl">Contributing factors</div><ul class="fc-dlist">' +
          r.factors.map(function(f) { return '<li>' + f + '</li>'; }).join('') + '</ul>';
      }
      innerHtml += '</div>';
    }

    return '<div class="fc" data-toggle="fc" id="finding-' + k + '">' +
      '<div class="fc-accent" style="background:' + s.c + '"></div>' +
      '<div class="fc-compact">' +
        '<div class="fc-num" style="background:' + s.bg + ';color:' + s.c + '">' + (idx + 1) + '</div>' +
        '<div class="fc-body">' +
          '<div class="fc-title">' + r.label + '</div>' +
          '<div class="fc-sub" style="color:' + sevColor + '">' + sevLabel + '</div>' +
        '</div>' +
        '<div class="fc-chev">' + SVG_ICONS.chevronDown + '</div>' +
      '</div>' +
      '<div class="fc-expand"><div class="fc-inner">' + innerHtml + '</div></div>' +
    '</div>';
  }).join('');

  // Build "Watch" cards for yellow-severity items (not bad enough for Priority, not green)
  var watchCards = '';

function buildSystems() {
  var SEV_ORDER = {ReasonablyCertain:0,HighlyLikely:1,Likely:2,Possible:3,ModerateChance:4,SlightChance:5,Unlikely:6};
  function sevRank(sys) { var r = SEV_ORDER[sys.progressValue]; return r !== undefined ? r : 6; }
  function sortBySev(a, b) { return sevRank(a) - sevRank(b); }

  var needsAttention = SYSTEMS.filter(function(sys) {
    var pv = sys.progressValue;
    return pv === 'ReasonablyCertain' || pv === 'HighlyLikely';
  }).sort(sortBySev);

  var keepEyeOn = SYSTEMS.filter(function(sys) {
    var pv = sys.progressValue;
    return pv === 'Likely' || pv === 'Possible' || pv === 'ModerateChance' || pv === 'SlightChance';
  }).sort(sortBySev);

  var lookingGood = SYSTEMS.filter(function(sys) {
    return sys.progressValue === 'Unlikely';
  });

  function buildExpandableTile(sys) {
    var sv = getSystemSev(sys);
    var deepHtml = '';
    if (sys.deep) {
      var signsList = sys.signs ? '<div class="sys-deep-label">Signs to watch</div><ul class="sys-deep-list">' +
        sys.signs.map(function(s) { return '<li>' + s + '</li>'; }).join('') + '</ul>' : '';
      var actionsList = sys.actions ? '<div class="sys-deep-label">What to do</div><ul class="sys-deep-list">' +
        sys.actions.map(function(a) { return '<li>' + a + '</li>'; }).join('') + '</ul>' : '';
      deepHtml = '<div class="sys-more" data-toggle="sys-deep"><span>More Details…</span><span class="sys-more-chev">' + String.fromCharCode(9662) + '</span></div>' +
        '<div class="sys-deep"><div class="sys-deep-inner">' +
          '<div class="sys-deep-p">' + sys.deep + '</div>' +
          signsList + actionsList +
        '</div></div>';
    }
    return '<div class="sys-tile" data-toggle="sys-tile">' +
      '<div class="sys-tile-top">' +
        '<div class="sys-icon" style="background:' + sv.bg + ';color:' + sv.c + '">' + sys.icon + '</div>' +
        '<div class="sys-name">' + sys.name + '</div>' +
        '<span class="sys-pill" style="background:' + sv.bg + ';color:' + sv.c + '">' + sv.l + '</span>' +
        '<div class="sys-tile-chev">' + String.fromCharCode(9662) + '</div>' +
      '</div>' +
      '<div class="sys-tile-detail"><div class="sys-tile-inner">' +
        sys.detail +
        '<div class="sys-tile-ratios">Related ratios: ' + sys.ratios + '</div>' +
        deepHtml +
      '</div></div></div>';
  }

  var needsAttentionTiles = needsAttention.map(buildExpandableTile).join('');
  var keepEyeOnTiles = keepEyeOn.map(buildExpandableTile).join('');

  var keepEyeOnHtml = '';
  if (keepEyeOn.length > 0) {
    keepEyeOnHtml = '<div style="margin-top:20px">' +
      '<div class="sec-lbl" style="margin-bottom:12px">KEEP AN EYE ON</div>' +
      '<div class="sys-grid">' + keepEyeOnTiles + '</div></div>';
  }

  var lookingGoodHtml = '';
  if (lookingGood.length > 0) {
    var goodRows = lookingGood.map(function(sys) {
      var sv = getSystemSev(sys);
      return '<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bdr-l)">' +
        '<div class="sys-icon" style="background:' + sv.bg + ';color:' + sv.c + ';flex-shrink:0">' + sys.icon + '</div>' +
        '<div style="flex:1">' +
          '<div style="font-size:var(--fs-base);font-weight:600;color:var(--t1)">' + sys.name + '</div>' +
        '</div>' +
        '<span class="sys-pill" style="background:' + sv.bg + ';color:' + sv.c + ';white-space:nowrap">' + sv.l + '</span>' +
      '</div>';
    }).join('');
    lookingGoodHtml = '<div style="margin-top:20px">' +
      '<div class="sec-lbl" style="margin-bottom:12px">LOOKING GOOD</div>' +
      '<div style="background:var(--sf);border-radius:var(--rm);border:1px solid var(--bdr-l);padding:12px 16px">' +
      goodRows +
      '</div></div>';
  }

  var needsHtml = '';
  if (needsAttention.length > 0) {
    needsHtml = '<div class="sec-lbl" style="margin-bottom:12px">NEEDS ATTENTION</div>' +
      '<div class="sys-grid">' + needsAttentionTiles + '</div>';
  }

  var html = '<div style="margin-top:20px">' +
    needsHtml +
    keepEyeOnHtml +
    lookingGoodHtml +
    '</div>';
  return html;
}

function buildToxin() {
  var bars = TOXICS.map(function(t) {
    var hi = t.val > t.max;
    var pct = Math.min((t.val / (t.max * 2)) * 100, 100);
    var ratio = t.val / t.max;
    var valText, valColor, valBg;
    if (hi) {
      valText = 'Eliminate ' + String.fromCharCode(183) + ' ' + t.val;
      valColor = 'var(--crit)';
      valBg = 'var(--crit-l)';
    } else if (ratio > 0.6) {
      valText = 'Reduce';
      valColor = 'var(--warn)';
      valBg = 'var(--warn-l)';
    } else {
      valText = 'Monitor';
      valColor = 'var(--caut)';
      valBg = 'var(--caut-l)';
    }
    var eduHtml = '';
    if (t.what) {
      var srcList = t.sources ? '<div class="tox-edu-label">Common sources</div><ul class="tox-edu-list">' +
        t.sources.map(function(s) { return '<li>' + s + '</li>'; }).join('') + '</ul>' : '';
      var redList = t.reduce ? '<div class="tox-edu-label">How to ' + (hi ? 'eliminate' : ratio > 0.6 ? 'reduce' : 'maintain') + '</div><ul class="tox-edu-list">' +
        t.reduce.map(function(r) { return '<li>' + r + '</li>'; }).join('') + '</ul>' : '';
      eduHtml = '<div class="tox-row-edu"><div class="tox-edu-inner">' +
        '<div class="tox-edu-what">' + t.what + '</div>' +
        srcList + redList + '</div></div>';
    }
    return '<div class="tox-row-wrap" data-toggle="tox-edu">' +
      '<div class="tox-row"><div class="tox-lbl">' + t.label + '</div>' +
      '<div class="tox-bar"><div class="tox-fill" style="width:' + (hi ? 100 : pct) + '%;background:' + (hi ? 'var(--crit)' : ratio > 0.6 ? 'var(--warn)' : 'var(--caut)') + '"></div></div>' +
      '<div class="tox-val" style="color:' + valColor + ';background:' + valBg + '">' + valText + '</div></div>' +
      '<div class="tox-row-more"><span>Learn more</span><span class="tox-more-chev">' + String.fromCharCode(9662) + '</span></div>' +
      eduHtml + '</div>';
  }).join('');

  return '<div class="tox" data-toggle="tox">' +
    '<div class="tox-top"><div class="tox-title" style="display:flex;align-items:center;gap:8px"><span style="width:18px;height:18px;flex-shrink:0">' + SVG_ICONS.warning + '</span>Aluminum Elevated</div><div class="tox-badge">87x above ref</div></div>' +
    '<div class="tox-sum">Oscar\'s aluminum level is significantly elevated. All 6 other metals tested are below reference limits.</div>' +
    '<div class="tox-hint">Tap for details ' + String.fromCharCode(9662) + '</div>' +
    '<div class="tox-expand"><div class="tox-inner">' + bars +
    '</div></div></div>';
}

function buildClinicalSigns() {
  // Collect signs from flagged systems, grouped by observable category
  var signMap = {};
  SYSTEMS.forEach(function(sys) {
    if (sys.progressValue === 'Unlikely') return;
    var sv = getSystemSev(sys);
    if (sys.signs) {
      sys.signs.forEach(function(sign) {
        if (!signMap[sign]) {
          signMap[sign] = {text: sign, systems: [], severity: sv};
        }
        signMap[sign].systems.push(sys.name);
        // Keep the highest severity
        var sevOrder = {Critical:0,Likely:1,Possible:2,Monitor:3,Slight:4,Healthy:5};
        if ((sevOrder[sv.l] || 5) < (sevOrder[signMap[sign].severity.l] || 5)) {
          signMap[sign].severity = sv;
        }
      });
    }
  });

  var allSigns = Object.keys(signMap).map(function(k) { return signMap[k]; });
  // Sort by severity (most severe first)
  var sevOrder = {Critical:0,Likely:1,Possible:2,Monitor:3,Slight:4,Healthy:5};
  allSigns.sort(function(a, b) { return (sevOrder[a.severity.l] || 5) - (sevOrder[b.severity.l] || 5); });

  if (allSigns.length === 0) return '';

  var rows = allSigns.map(function(s) {
    var systemTags = s.systems.map(function(sys) {
      return '<span style="display:inline-block;font-size:9px;font-weight:600;padding:2px 7px;border-radius:100px;background:' + s.severity.bg + ';color:' + s.severity.c + ';margin-right:3px">' + sys + '</span>';
    }).join('');
    return '<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--bdr-l)">' +
      '<div style="width:8px;height:8px;border-radius:50%;background:' + s.severity.c + ';flex-shrink:0;margin-top:5px"></div>' +
      '<div style="flex:1">' +
        '<div style="font-size:13px;font-weight:600;color:var(--t1);margin-bottom:4px">' + s.text + '</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:3px">' + systemTags + '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  return '<div style="background:var(--sf);border-radius:var(--r);padding:18px 20px;border:1px solid var(--bdr-l);box-shadow:var(--s1)">' +
    '<div style="font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:16px">These are observable signs linked to Oscar\'s mineral imbalances. Track any you notice and share with your vet.</div>' +
    '<div>' + rows + '</div>' +
  '</div>';
}

function buildPdfLabInline() {
  // Reuse the lab modal content but render it inline for PDF
  var RATIO_KEYS = ["CaK","CaMg","CaP","NaK","NaMg","ZnCu","FeCu"];

  }).join('');

  var mineralRows = MINERALS.map(function(m) {
    var diff = Math.abs(m.val - m.ideal) / m.ideal;
    var status = diff < 0.3 ? 'Normal' : diff < 0.7 ? 'Watch' : 'Flag';
    var statusColor = diff < 0.3 ? 'var(--ok)' : diff < 0.7 ? 'var(--caut)' : 'var(--crit)';

      '<td style="padding:3px 8px;font-size:11px;font-weight:600;color:' + statusColor + '">' + status + '</td></tr>';
  }).join('');

  var toxicRows = TOXICS.map(function(t) {
    var over = t.val > t.max;
    var ratio = t.val / t.max;
    var statusText, statusColor;
    if (over) {
      statusText = ratio.toFixed(0) + 'x over limit';
      statusColor = 'var(--crit)';
    } else if (ratio > 0.6) {
      statusText = 'Moderate';
      statusColor = 'var(--warn)';

      '<td style="padding:3px 8px;font-size:11px;color:var(--t2)">' + t.label + '</td>' +
      '<td style="padding:3px 8px;font-size:12px;text-align:center;font-weight:700;color:' + (over?'var(--crit)':'var(--t1)') + '">' + t.val + '</td>' +
      '<td style="padding:3px 8px;font-size:12px;text-align:center;color:var(--t3)">' + String.fromCharCode(8804) + t.max + '</td>' +
      '<td style="padding:3px 8px;font-size:11px;font-weight:600;color:' + statusColor + '">' + statusText + '</td></tr>';
  }).join('');

  var tableStyle = 'width:100%;border-collapse:collapse;background:var(--sf);border:1px solid var(--bdr-l);border-radius:8px;overflow:hidden';
  var thStyle = 'padding:6px 8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);text-align:left;border-bottom:2px solid var(--bdr)';

  return '<div class="pdf-lab-inline sec">' +
    '<div class="sec-hdr"><span class="sec-lbl">Lab Values</span></div>' +
    '<div style="margin-bottom:16px">' +
      '<div style="font-size:13px;font-weight:700;margin-bottom:8px">Mineral Ratios</div>' +
      '<table style="' + tableStyle + '"><thead><tr>' +
        '<th style="' + thStyle + '">Ratio</th><th style="' + thStyle + ';text-align:center">Canine Ideal</th><th style="' + thStyle + ';text-align:center">' + PET.name + '</th><th style="' + thStyle + '">Status</th>' +
      '</tr></thead><tbody>' + ratioRows + '</tbody></table>' +
    '</div>' +
    '<div style="margin-bottom:16px">' +
      '<div style="font-size:13px;font-weight:700;margin-bottom:8px">Nutrient Minerals (ppm)</div>' +
      '<table style="' + tableStyle + '"><thead><tr>' +
        '<th style="' + thStyle + '">Key</th><th style="' + thStyle + '">Mineral</th><th style="' + thStyle + ';text-align:center">Value</th><th style="' + thStyle + ';text-align:center">Ideal</th><th style="' + thStyle + '">Status</th>' +
      '</tr></thead><tbody>' + mineralRows + '</tbody></table>' +
    '</div>' +
    '<div style="margin-bottom:16px">' +
      '<div style="font-size:13px;font-weight:700;margin-bottom:8px">Toxic Metals</div>' +
      '<table style="' + tableStyle + '"><thead><tr>' +
        '<th style="' + thStyle + '">Key</th><th style="' + thStyle + '">Metal</th><th style="' + thStyle + ';text-align:center">Value</th><th style="' + thStyle + ';text-align:center">Limit</th><th style="' + thStyle + '">Status</th>' +
      '</tr></thead><tbody>' + toxicRows + '</tbody></table>' +
    '</div>' +
  '</div>';
}

function buildPdfFooterNote() {
  return '<div class="pdf-footer-note">This report was generated by CheckPup (checkpup.com) using Dr. Ava Frick\'s Clinical Animal Nutrition (CAN) Survey methodology. ' +
    'Based on hair tissue mineral analysis (HTMA). For informational purposes only — does not replace veterinary diagnosis. ' +
    'Report generated ' + new Date().toLocaleDateString('en-US', {year:'numeric',month:'long',day:'numeric'}) + '.</div>';
}

function buildPdfOverlay() {
  return '<div class="pdf-overlay" id="pdf-overlay" data-html2canvas-ignore="true">' +
    '<div class="pdf-overlay-spinner"></div>' +
    '<div class="pdf-overlay-text">Generating PDF…</div>' +
    '<div class="pdf-overlay-sub">This may take a few seconds</div>' +
  '</div>';
}

function generatePDF() {
  var overlay = document.getElementById('pdf-overlay');
  if (overlay) overlay.classList.add('active');

  // Remember current view mode
  var wasDetailed = document.body.classList.contains('detailed-mode');

  // Force detailed mode for PDF (expand everything via CSS)
  document.body.classList.add('detailed-mode');
  // Also add .open classes for elements that were manually toggled
  document.querySelectorAll('.fc').forEach(function(el) { el.classList.add('open'); });
  document.querySelectorAll('.sys-tile').forEach(function(el) { el.classList.add('open'); el.classList.add('deep'); });
  document.querySelectorAll('.tox').forEach(function(el) { el.classList.add('open'); });
  document.querySelectorAll('.tox-row-wrap').forEach(function(el) { el.classList.add('open'); });

  // Enter PDF mode
  document.documentElement.classList.add('pdf-mode');
  document.body.style.maxWidth = 'none';
  document.body.style.width = '794px';
  document.body.style.margin = '0';
  document.body.style.padding = '0';
  document.body.style.background = '#fff';
  document.body.style.overflow = 'visible';
  // Force reflow so html2canvas sees the updated layout
  document.body.offsetHeight;

  var fileName = PET.name.toLowerCase().replace(/[^a-z0-9]/g, '-') + '-checkpup-report.pdf';

  setTimeout(function() {
    // Scroll to top to avoid offset issues
    window.scrollTo(0, 0);
    var element = document.body;
    var opt = {
      margin: [8, 0, 10, 0],
      filename: fileName,
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: {
        scale: 2,
        useCORS: true,
        letterRendering: true,
        scrollY: 0,
        scrollX: 0,
        windowWidth: 794,
        width: 794,
        x: 0,
        y: 0
      },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
    };

    html2pdf().set(opt).from(element).save().then(function() {
      // Restore original state
      document.documentElement.classList.remove('pdf-mode');
      document.body.style.maxWidth = '420px';
      document.body.style.width = '';
      document.body.style.margin = '0 auto';
      document.body.style.padding = '';
      document.body.style.background = '';
      document.body.style.overflow = '';
      if (!wasDetailed) {
        document.body.classList.remove('detailed-mode');
        document.querySelectorAll('.fc').forEach(function(el) { el.classList.remove('open'); });
        document.querySelectorAll('.sys-tile').forEach(function(el) { el.classList.remove('open'); el.classList.remove('deep'); });
        document.querySelectorAll('.tox').forEach(function(el) { el.classList.remove('open'); });
        document.querySelectorAll('.tox-row-wrap').forEach(function(el) { el.classList.remove('open'); });
      }
      if (overlay) overlay.classList.remove('active');
    }).catch(function(err) {
      console.error('PDF generation failed:', err);
      document.documentElement.classList.remove('pdf-mode');
      document.body.style.maxWidth = '420px';
      document.body.style.width = '';
      document.body.style.margin = '0 auto';
      document.body.style.overflow = '';
      if (!wasDetailed) document.body.classList.remove('detailed-mode');
      if (overlay) overlay.classList.remove('active');
      alert('PDF generation failed. Please try again.');
    });
  }, 300);
}

function render() {
  document.body.innerHTML = buildPdfVetHeader() + buildHeader() + buildHero() +
    '<div class="sec" id="what-we-found">' + buildSecHdr("What we found") + buildFindings() + buildGoodNews() + '</div>' +
    '<div class="sec" id="systems-section">' + buildSecHdr("Body Systems") + buildSystems() + '</div>' +
    '<div class="sec" id="toxin-section">' + buildSecHdr("Toxic Metals") + buildToxin() + '</div>' +
    '<div class="sec" id="clinical-signs">' + buildSecHdr("Clinical Signs") + buildClinicalSigns() + '</div>' +
    '<div class="sec">' + buildSecHdr("Oscar\'s Plan") + buildPlan() + '</div>' +
    buildPdfLabInline() +
    buildFooter() +
    buildPdfFooterNote() +
    buildLabModal() +
    buildPdfOverlay();
  bindEvents();
}

function bindEvents() {
  document.addEventListener('click', function(e) {
    var pdfBtn = e.target.closest('[data-action="download-pdf"]');
    if (pdfBtn) {
      if (typeof html2pdf === 'undefined') {
        alert('PDF library is still loading. Please wait a moment and try again.');
        return;
      }
      generatePDF();
      return;
    }

    var viewBtn = e.target.closest('[data-view]');
    if (viewBtn) {
      var mode = viewBtn.getAttribute('data-view');
      var toggle = document.getElementById('view-toggle');
      if (toggle) {
        toggle.querySelectorAll('.view-toggle-btn').forEach(function(b) {
          b.classList.toggle('active', b.getAttribute('data-view') === mode);
        });
      }
      if (mode === 'detailed') {
        document.body.classList.add('detailed-mode');
      } else {
        document.body.classList.remove('detailed-mode');
        // Collapse all manually-opened items back to closed
        document.querySelectorAll('.fc.open').forEach(function(el) { el.classList.remove('open'); });
        document.querySelectorAll('.sys-tile.open').forEach(function(el) { el.classList.remove('open'); el.classList.remove('deep'); });
        document.querySelectorAll('.tox.open').forEach(function(el) { el.classList.remove('open'); });
        document.querySelectorAll('.tox-row-wrap.open').forEach(function(el) { el.classList.remove('open'); });
      }
      return;
    }

    var labOpen = e.target.closest('[data-action="open-lab"]');
    if (labOpen) {
      var modal = document.getElementById('lab-modal');
      if (modal) { modal.classList.add('open'); document.body.style.overflow = 'hidden'; }
      return;
    }
    var labClose = e.target.closest('[data-action="close-lab"]');
    if (labClose) {
      var modal2 = document.getElementById('lab-modal');
      if (modal2) { modal2.classList.remove('open'); document.body.style.overflow = ''; }
      return;
    }
    if (e.target.id === 'lab-modal') {
      e.target.classList.remove('open');
      document.body.style.overflow = '';
      return;
    }

    var scrollEl = e.target.closest('[data-scroll]');
    if (scrollEl) {
      var id = scrollEl.getAttribute('data-scroll');
      var el = document.getElementById(id);
      if (el) {
        var offset = 80;
        var y = el.getBoundingClientRect().top + window.pageYOffset - offset;
        window.scrollTo({top: y, behavior: 'smooth'});
      }
      return;
    }

    var fc = e.target.closest('[data-toggle="fc"]');
    if (fc && !e.target.closest('.fc-inner')) {
      fc.classList.toggle('open');
      return;
    }

    var sysTile = e.target.closest('[data-toggle="sys-tile"]');
    if (sysTile && !e.target.closest('.sys-tile-inner')) {
      sysTile.classList.toggle('open');
      return;
    }

    var toxEdu = e.target.closest('[data-toggle="tox-edu"]');
    if (toxEdu && !e.target.closest('.tox-edu-inner')) {
      toxEdu.classList.toggle('open');
      e.stopPropagation();
      return;
    }

    var tox = e.target.closest('[data-toggle="tox"]');
    if (tox && !e.target.closest('.tox-inner')) {
      tox.classList.toggle('open');
      return;
    }

    var sysDeep = e.target.closest('[data-toggle="sys-deep"]');
    if (sysDeep) {
      var tile = sysDeep.closest('.sys-tile');
      if (tile) tile.classList.toggle('deep');
      e.stopPropagation();
      return;
    }

    var ci = e.target.closest('[data-check]');
    if (ci) {
      var cid = ci.getAttribute('data-check');
      checkedItems[cid] = !checkedItems[cid];
      var box = ci.querySelector('.ci-box');
      var txt = ci.querySelector('.ci-txt');
      if (box) box.classList.toggle('on', checkedItems[cid]);
      if (txt) txt.classList.toggle('done', checkedItems[cid]);
      updatePhaseProgress();
      return;
    }
  });
}

function updatePhaseProgress() {
  PHASES.forEach(function(phase, pi) {
    var doneCount = phase.items.filter(function(it) { return checkedItems[it.id]; }).length;
    var pct = Math.round(doneCount / phase.items.length * 100);
    var phaseEl = document.querySelector('[data-phase="' + pi + '"]');
    if (phaseEl) {
      var fill = phaseEl.querySelector('.ph-prog-fill');
      var label = phaseEl.querySelector('.ph-prog-pct');
      if (fill) fill.style.width = pct + '%';
      if (label) label.textContent = pct + '%';
    }
  });
}

render();
</script>
</body>
</html>
